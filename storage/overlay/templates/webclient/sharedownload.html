{{template "base" .}}

{{- define "page_body"}}
<div class="d-flex flex-center flex-column flex-column-fluid p-10 pb-lg-20">
    <div class="mb-12">
        <span>
            <img alt="Logo" src="{{.StaticURL}}{{.Branding.LogoPath}}" class="h-80px h-md-90px h-lg-100px" />
        </span>
        <span class="text-gray-900 fs-1 fw-bold ms-3 ps-5">
            {{.Branding.ShortName}}
        </span>
    </div>
    <div class="card shadow-sm w-lg-600px w-md-450px">
        <div class="card-header bg-light">
            <h3 data-i18n="fs.download_ready" class="card-title section-title">Your download is ready</h3>
            {{- if .LogoutURL}}
            <div class="card-toolbar">
                <a id="id_logout_link" href="#" class="btn btn-light-primary">
                    <span data-i18n="login.signout">Sign out</span>
                </a>
            </div>
            {{- end}}
        </div>
        <div class="card-body">
            <div class="air-share-details">
<div class="air-public-share-person"><img class="air-public-share-avatar" src="{{.ShareOwnerAvatar}}" alt="分享人头像" data-air-i18n-attrs><span><span data-air-i18n>分享人：</span><strong>{{.ShareOwner}}</strong></span></div>
                <div class="air-share-label"><span data-air-i18n>分享内容</span></div>
                <ul class="air-share-names">{{range .ShareItems}}<li class="air-share-name"><i class="ki-duotone {{if .Directory}}ki-folder{{else}}ki-file{{end}} fs-2x text-primary"><i class="path1"></i><i class="path2"></i></i><span>{{.Name}}</span></li>{{end}}</ul>
                <div class="air-share-time"><span data-air-i18n>分享时间：</span><time data-air-share-created="{{.ShareCreatedAt}}">—</time></div>
            </div>
            <div>
                <a id="air-share-single-download" data-air-single="{{if eq (len .ShareItems) 1}}{{range .ShareItems}}{{if not .Directory}}true{{end}}{{end}}{{end}}" href="{{.DownloadLink}}" class="btn btn-primary btn-block">
                    <i class="ki-duotone ki-folder-down fs-2">
                        <span class="path1"></span>
                        <span class="path2"></span>
                    </i>
                    <span data-i18n="fs.download">Download</span>
                </a>
            </div>
        </div>
    </div>
</div>
<script src="{{.StaticURL}}/air-background.js?v=20261019-progress2"></script>
<script {{if .CSPNonce}}nonce="{{.CSPNonce}}"{{end}}>
{const link=document.getElementById('air-share-single-download');if(link?.dataset.airSingle==='true'){const owner='share:'+link.href;AirCloudTransfers.connect({owner,share:true});link.addEventListener('click',event=>{event.preventDefault();AirCloudTransfers.enqueueFile({owner,url:link.href,name:document.querySelector('.air-share-name span').textContent,size:0}).catch(()=>alert(window.AirI18n.t('下载失败')))});}}
</script>
{{- end}}
