{{template "base" .}}

{{- define "page_body"}}
<div class="d-flex flex-center flex-column flex-column-fluid p-10 pb-lg-20">
    <div class="mb-12">
        <span>
            <img alt="Logo" src="{{.StaticURL}}{{.Branding.LogoPath}}" class="h-80px h-md-90px h-lg-100px" />
        </span>
        <span class="text-gray-900 fs-1 fw-bold ms-3 ps-5">
            {{.Branding.ShortName}}
        </span>
    </div>
    <div class="card shadow-sm w-lg-600px w-md-450px">
        <div class="card-header bg-light">
            <h3 data-i18n="fs.download_ready" class="card-title section-title">Your download is ready</h3>
            {{- if .LogoutURL}}
            <div class="card-toolbar">
                <a id="id_logout_link" href="#" class="btn btn-light-primary">
                    <span data-i18n="login.signout">Sign out</span>
                </a>
            </div>
            {{- end}}
        </div>
        <div class="card-body">
            <div class="air-share-details">
<div class="air-public-share-person"><img class="air-public-share-avatar" src="{{.ShareOwnerAvatar}}" alt="分享人头像"><span>分享人：<strong>{{.ShareOwner}}</strong></span></div>
                <div class="air-share-label">分享内容</div>
                <ul class="air-share-names">{{range .ShareItems}}<li class="air-share-name"><i class="ki-duotone {{if .Directory}}ki-folder{{else}}ki-file{{end}} fs-2x text-primary"><i class="path1"></i><i class="path2"></i></i><span>{{.Name}}</span></li>{{end}}</ul>
                <div class="air-share-time">分享时间：<time data-air-share-created="{{.ShareCreatedAt}}">—</time></div>
            </div>
            <script {{if .CSPNonce}}nonce="{{.CSPNonce}}"{{end}}>document.querySelectorAll('[data-air-share-created]').forEach(function(el){var stamp=Number(el.dataset.airShareCreated);if(stamp>0){el.dateTime=new Date(stamp).toISOString();el.textContent=new Date(stamp).toLocaleString('zh-CN',{hour12:false});}});</script>
            <div>
                <a href="{{.DownloadLink}}" class="btn btn-primary btn-block">
                    <i class="ki-duotone ki-folder-down fs-2">
                        <span class="path1"></span>
                        <span class="path2"></span>
                    </i>
                    <span data-i18n="fs.download">Download</span>
                </a>
            </div>
        </div>
    </div>
</div>
{{- end}}
