name: browsernas
services:
  storage:
    image: air-cloud-storage:2.7.6-nas-v3
    build:
      context: .
      dockerfile: storage/Dockerfile
    restart: unless-stopped
    environment:
      NAS_REGISTRATION_ENABLED: "${NAS_REGISTRATION_ENABLED:-true}"
      NAS_REGISTRATION_QUOTA_GB: "${NAS_REGISTRATION_QUOTA_GB:-50}"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: "0.0.0.0"
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: X-Real-IP
      SFTPGO_DATA_PROVIDER__BACKUPS_PATH: /srv/sftpgo/backups
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /srv/sftpgo/data
      SFTPGO_COMMON__DEFENDER__ENABLED: "true"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "true"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
      SFTPGO_HTTPD__BINDINGS__0__LANGUAGES: zh-CN
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__NAME: Air Cloud 管理中心
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__SHORT_NAME: Air Cloud
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__FAVICON_PATH: /air-cloud.svg
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__LOGO_PATH: /air-cloud.svg
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__NAME: Air Cloud
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__SHORT_NAME: Air Cloud
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__FAVICON_PATH: /air-cloud.svg
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__LOGO_PATH: /air-cloud.svg
      SFTPGO_HTTPD__COOKIE_LIFETIME: "43200"
      SFTPGO_COMMON__UPLOAD_MODE: "1"
    volumes:
      - settings:/var/lib/sftpgo
      - files:/srv/sftpgo
      - archive-cache:/tmp/air-cloud-archives-v1
    networks: [backend, egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  portal:
    image: node:22.22.0-alpine
    user: node
    working_dir: /app
    command: [node, server.cjs]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NAS_UPSTREAM: http://storage:8080
      NAS_TRUSTED_PROXIES: "${NAS_TRUSTED_PROXIES:-}"
    volumes:
      - ./portal:/app:ro
      - portal_accounts:/home/node
    ports:
      - "${NAS_BIND:-127.0.0.1}:${NAS_PORT:-8088}:8088"
    depends_on: [storage]
    networks: [backend, frontend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tools:
    image: alpine:3.23
    profiles: [tools]
    network_mode: none
    volumes:
      - settings:/source/settings
      - files:/source/files
      - ./backups:/backup
    entrypoint: []
    command: ["true"]
volumes:
  portal_accounts:
  settings:
  files:
  archive-cache:
networks:
  backend:
    internal: true
  frontend:
  egress:
